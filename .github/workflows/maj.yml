name: Mise à jour des matchs
on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures (le direct est géré par la page elle-même)
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]        # republie le site quand le code change
permissions:
  contents: write
concurrency:
  group: maj                # jamais deux mises à jour en même temps
  cancel-in-progress: false
jobs:
  maj:
    runs-on: ubuntu-latest
    timeout-minutes: 150    # le 1er lancement remplit 2 saisons de ~65 compétitions
    steps:
      - uses: actions/checkout@v4
      - name: Reprendre la base de la dernière mise à jour
        run: |
          # base compressée (GitHub refuse les fichiers de plus de 100 Mo) ; foot.db seul = ancien format
          # branche "base" (hors du site) ; 1re fois après le déménagement : encore sur la branche "site"
          # en morceaux de 90 Mo (foot.db.xz.part00, part01…) : GitHub refuse les fichiers de plus de 100 Mo ; avant : un seul fichier
          if git fetch --depth=1 origin base && git checkout FETCH_HEAD -- . 2>/dev/null && ls foot.db.xz* >/dev/null 2>&1; then
            if ls foot.db.xz.part* >/dev/null 2>&1; then cat foot.db.xz.part* | xz -d > foot.db && rm foot.db.xz.part*; else xz -d foot.db.xz; fi
          else
            { git fetch --depth=1 origin site && git checkout FETCH_HEAD -- foot.db.xz && xz -d foot.db.xz; } || echo "Pas encore de base : remplissage complet"
          fi
      - run: python3 foot.py
      - name: Ranger la base sur la branche "base" (hors du site, que GitHub Pages limite à 1 Go)
        run: |
          mkdir _base && xz -6 -T0 -c foot.db | split -b 90m -d - _base/foot.db.xz.part && ls -l _base && cd _base && git init -q -b base && git add -A
          git -c user.name=maj-auto -c user.email=actions@users.noreply.github.com commit -qm "Base $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" base
      - name: Ranger les vieilles saisons dans le dépôt Foot-archives (chaque site GitHub Pages est limité à 1 Go)
        env:
          JETON: ${{ secrets.ARCHIVES_TOKEN }}
        run: |
          # sans jeton (dépôt d'archives pas encore préparé) : tout reste sur le site, comme avant
          [ -n "$JETON" ] || { echo "::warning::Pas de secret ARCHIVES_TOKEN, vieilles saisons gardées sur le site"; exit 0; }
          depot="https://${{ github.repository_owner }}:$JETON@github.com/${{ github.repository }}-archives.git"
          limite=$(( $(date -u +%Y) - 5 ))   # saisons de plus de 5 ans (en 2026 : 2020-21 et avant)
          mkdir _archives && touch _archives/.nojekyll
          for f in matchs-*.json joueurs-*.json; do a=${f//[^0-9]/}; [ "$a" -lt "$limite" ] && mv "$f" _archives/ || true; done
          echo "Archives : $(ls _archives | wc -l) fichiers, $(du -sm --apparent-size _archives | cut -f1) Mo"
          # ces saisons ne bougent presque plus : envoi une fois par jour (vers 3 h UTC), au lancement à la main,
          # quand le code change, ou si le dépôt d'archives est encore vide ; sinon on garde ce qui y est déjà
          if [ "$(date -u +%H)" = "03" ] || [ "${{ github.event_name }}" != "schedule" ] || ! git ls-remote --exit-code "$depot" main >/dev/null; then
            cd _archives && git init -q -b main && git add -A
            git -c user.name=maj-auto -c user.email=actions@users.noreply.github.com commit -qm "Archives $(date -u +%FT%TZ)"
            git push -f "$depot" main || { echo "::warning::Envoi des archives raté, vieilles saisons gardées sur le site"; cd .. && mv _archives/*.json . ; }
          fi
      - name: Publier le site sur la branche "site" (écrasée à chaque fois, pour garder le dépôt léger)
        run: |
          mkdir _site && cp -r index.html sw.js equipes.json palmares.json matchs*.json joueurs*.json carrieres identites joueur equipe competition pages.css plan.html sitemap*.xml _site/ && touch _site/.nojekyll
          # GitHub Pages refuse les sites de plus de 1 Go : on s'arrête avant (l'ancien site reste en ligne)
          taille=$(du -sm --apparent-size _site | cut -f1); echo "Taille du site : $taille Mo"
          [ "$taille" -lt 950 ] || { echo "::error::Site trop gros ($taille Mo)"; exit 1; }
          cd _site && git init -q -b site && git add -A
          git -c user.name=maj-auto -c user.email=actions@users.noreply.github.com commit -qm "Mise à jour $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
